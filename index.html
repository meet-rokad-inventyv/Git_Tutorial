<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Company CI/CD Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #020617;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #cbd5f5;
        }

        .env {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #22c55e;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 CI/CD Pipeline Test</h1>
        <p>This page is used to test GitHub Actions workflow.</p>

        <div class="env">
            Environment: <span id="env">Unknown</span>
        </div>

        <footer>
            © 2026 My Company | GitHub Actions
        </footer>
    </div>
<!-- prod1 -->
    <script>
        /*
          Manually change this value
          OR inject it via CI in future
        */
        const ENVIRONMENT = "alpha"; // alpha | beta | dev | prod
        document.getElementById("env").innerText = ENVIRONMENT;
    </script>

</body>
</html>
